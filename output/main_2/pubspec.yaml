name: main_2
description: A new Flutter application powered by Kiro.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  # Core
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Routing
  go_router: ^14.2.0

  # Network & Storage
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2


  # Auth Module
  google_sign_in: ^6.2.1

  # Chat Module
  cached_network_image: ^3.3.0

  # Notifications Module
  flutter_local_notifications: ^17.0.0

  # Payments Module
  # razorpay_flutter: ^1.3.6  # Uncomment and configure

  # Tracking/Maps Module
  google_maps_flutter: ^2.5.3
  geolocator: ^11.0.0

  # Booking Module
  table_calendar: ^3.0.9

  # Profile Module
  image_picker: ^1.0.5


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  freezed: ^2.4.6
  freezed_annotation: ^2.4.1
  json_serializable: ^6.7.1
  json_annotation: ^4.8.1


flutter:
  uses-material-design: true
  
