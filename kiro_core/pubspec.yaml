name: kiro_core
description: "Core infrastructure package for Kiro-powered Flutter applications. Contains network, storage, permissions, theming, localization, and utility services."
version: 0.1.0
homepage: https://github.com/chaitanyamhetre/kiro
repository: https://github.com/chaitanyamhetre/kiro/tree/main/kiro_core
issue_tracker: https://github.com/chaitanyamhetre/kiro/issues

environment:
  sdk: ^3.0.0
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # Network
  dio: ^5.4.0
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Permissions
  permission_handler: ^11.3.0
  
  # Platform Services
  connectivity_plus: ^6.0.3
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.2
  
  # Routing
  go_router: ^14.2.0
  
  # Utilities
  equatable: ^2.0.5
  intl: ^0.19.0
  uuid: ^4.3.3
  
  # Logging
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.8
  freezed: ^2.4.6
  freezed_annotation: ^2.4.1
  json_serializable: ^6.7.1
  json_annotation: ^4.8.1
  
  # Testing
  mocktail: ^1.0.3

flutter:
