# Auth Module Configuration
name: auth
display_name: Authentication
description: User authentication with email, phone, and social login support
version: 1.0.0

# Compatibility
kiro_core_version: ^0.1.0
kiro_cli_version: ^0.1.0

# Dependencies
dependencies:
  - name: firebase_auth
    version: ^4.16.0
    optional: true
  - name: google_sign_in
    version: ^6.2.1
    optional: true
  - name: flutter_secure_storage
    version: ^9.0.0

# Permissions
permissions:
  - camera  # For profile picture
  - photos  # For profile picture

# Routes
routes:
  - path: /login
    name: login
    builder: LoginScreen
  - path: /signup
    name: signup
    builder: SignupScreen
  - path: /forgot-password
    name: forgotPassword
    builder: ForgotPasswordScreen
  - path: /verify-otp
    name: verifyOtp
    builder: VerifyOtpScreen

# Providers
providers:
  - AuthProvider
  - AuthState

# Configuration
config:
  enable_biometric:
    type: bool
    default: false
    description: Enable biometric authentication
  enable_social_login:
    type: bool
    default: true
    description: Enable Google/Apple sign-in
  otp_expiry_minutes:
    type: int
    default: 5
    description: OTP expiration time in minutes

