# Auth Module Configuration
name: auth
display_name: Authentication
description: User authentication with email, phone, and social login support
version: 1.0.0

# Compatibility
kiro_core_version: ^0.1.0
kiro_cli_version: ^0.1.0

# Package dependencies (added to pubspec.yaml)
dependencies:
  - name: firebase_auth
    version: ^4.16.0
    optional: true
  - name: google_sign_in
    version: ^6.2.1
    optional: true
  - name: flutter_secure_storage
    version: ^9.0.0

# Core dependencies (from kiro_core)
core_dependencies:
  - network
  - storage
  - permissions

# Permissions
permissions:
  - camera  # For profile picture
  - photos  # For profile picture

# Routes (auto-generated into router.dart)
routes:
  - path: /login
    name: login
    screen: LoginScreen
    requires_auth: false
  - path: /signup
    name: signup
    screen: SignupScreen
    requires_auth: false
  - path: /forgot-password
    name: forgotPassword
    screen: ForgotPasswordScreen
    requires_auth: false
  - path: /verify-otp
    name: verifyOtp
    screen: VerifyOtpScreen
    requires_auth: false

# Providers (Riverpod providers to register)
providers:
  - name: AuthProvider
    path: providers/auth_provider.dart
  - name: AuthState
    path: providers/auth_provider.dart

# Configuration options
config:
  enable_biometric:
    type: bool
    default: false
    description: Enable biometric authentication
  enable_social_login:
    type: bool
    default: true
    description: Enable Google/Apple sign-in
  otp_expiry_minutes:
    type: int
    default: 5
    description: OTP expiration time in minutes

