# Payments Module Configuration
name: payments
display_name: Payment Gateway
description: Payment gateway integrations (Razorpay, Stripe, Cashfree)
version: 1.0.0

# Compatibility
kiro_core_version: ^0.1.0
kiro_cli_version: ^0.1.0

# Dependencies
dependencies:
  - name: razorpay_flutter
    version: ^1.3.6
    optional: true

# Permissions
permissions: []

# Routes
routes:
  - path: /payments
    name: payments
    builder: PaymentsScreen
  - path: /payments/checkout
    name: checkout
    builder: CheckoutScreen

# Providers
providers:
  - PaymentProvider

# Configuration
config:
  default_gateway:
    type: string
    default: "razorpay"
    description: Default payment gateway
  enable_wallet:
    type: bool
    default: true
    description: Enable wallet payments

